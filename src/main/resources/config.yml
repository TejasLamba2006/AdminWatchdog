# AdminWatchdog configuration

# Discord integration
discord:
  webhook-url: ""
  enabled: true

  # Batch multiple command logs into fewer Discord requests.
  # Helps reduce request spikes during command spam.
  batching:
    enabled: false
    # Flush interval in milliseconds
    interval-ms: 1000
    # Maximum messages to merge per Discord request
    max-messages: 10
    # Max total characters in one batched Discord message
    max-combined-length: 1800

  # Rich embed settings for creative inventory
  embeds:
    enabled: true
    # Use rich embeds with item images and descriptions
    creative-inventory: true
    # Embed color (hex)
    color: "#00d4aa"
    # Include item description from API
    include-description: true
    # Include technical details (stack size, renewable, etc.)
    include-technical-details: true
    # Fallback to simple message if API fails
    fallback-to-simple: true

# Custom command responses
# When specific commands are run, send custom messages to Discord
# Separate filters for player and console commands
# RESPECTS MONITORING PERMISSIONS - only triggers for monitored players
custom-responses:
  enabled: true

  # Suppress normal command logging when a custom response is triggered
  # This prevents getting two notifications (one custom, one normal) for the same event
  suppress-normal-logging: false

  # Repeat / burst triggers
  # Triggers when the same actor repeats a matching command pattern N times within X seconds
  # Placeholders: %player%, %sender%, %command%, %count%, %interval%, %time%
  repeat-triggers:
    enabled: false

    # Player-based repeat triggers
    player:
      # Example: alert if someone runs /smg 3 times within 10 seconds
      - pattern: "smg"
        count: 3
        interval-seconds: 10
        response: "⚠️ **SPAM DETECTED** - %player% repeated /smg %count%x in %interval%s. Last: %command%"

      # Example: alert if large give commands are spammed quickly
      - pattern: "give * * >=5"
        count: 3
        interval-seconds: 15
        response: "🚨 **BURST GIVE** - %player% repeated high-amount gives %count%x in %interval%s. Last: %command%"

    # Console-based repeat triggers
    console:
      # Example: alert if automated task repeatedly runs stop/restart style commands
      - pattern: "stop"
        count: 2
        interval-seconds: 30
        response: "⚠️ **CONSOLE BURST** - %sender% repeated stop command %count%x in %interval%s"

  # Player command responses
  # Use %player%, %command%, %time% placeholders
  player:
    #
    # BASIC EXAMPLES (matches base command):
    # ban: "⚠️ **ADMIN ACTION** - %player% used ban command at %time%"
    # kick: "⚠️ **ADMIN ACTION** - %player% used kick command at %time%"
    # op: "🔐 **CRITICAL** - %player% used OP command! <@&ROLE_ID_HERE> at %time%"
    # gamemode: "🎮 **GAMEMODE** - %player% changed gamemode at %time%"
    #
    # ADVANCED EXAMPLES (matches specific subcommands):
    # "lp user": "⚠️ **LUCKPERMS** - %player% modified a user at %time%"
    # "lp group": "⚠️ **LUCKPERMS** - %player% modified a group at %time%"
    #
    # WILDCARD & THRESHOLD EXAMPLES:
    # * matches any single argument
    # >=X, <=X, >X, <X, ==X matches numbers based on conditions
    # "lp user * permission set *": "🔐 **CRITICAL** - %player% set permission with: %command% at %time%"
    # "lp user * parent add *": "⚠️ **RANK CHANGE** - %player% added rank: %command% at %time%"
    # "ban * *": "🔨 **BAN** - %player% banned someone: %command% at %time%"
    # "give * * >=5": "⚠️ **LARGE SPAWN** - %player% gave 5+ items! %command% at %time%"

  # Console command responses
  # Use %sender%, %command%, %time% placeholders
  console:
    #
    # EXAMPLES:
    # "stop": "🛑 **SERVER SHUTDOWN** - Console is stopping the server at %time%! <@&ADMIN_ROLE_ID>"
    # "reload": "🔄 **SERVER RELOAD** - %sender% reloaded server at %time%"
    # "give * * 64": "📦 **ITEM SPAWN** - %sender% gave items via console: %command%"
    #
    # Available placeholders: %sender%, %command%, %time%
    # Discord mentions: <@USER_ID>, <@&ROLE_ID>, @everyone

# Monitoring settings
monitoring:
  # Monitor operators
  ops: true

  # Monitor players with specific permissions
  permissions:
    enabled: true
    # Permissions to monitor
    list:
      - "adminwatchdog.monitor"
      - "minecraft.command.*"
      - "bukkit.command.*"
      - "essentials.*"

  # Monitor console commands
  console: true

  # Monitor gamemode changes
  gamemode-changes: true

  # Monitor creative inventory actions
  creative-inventory:
    enabled: true
    # Only monitor ops taking items from creative
    ops-only: false
    # Only monitor players with specific permissions
    permissions-only: false
    # Log item details (name, amount, enchantments)
    detailed-logging: true

  # Monitor items dropped by creative mode players
  # Tracks when admins drop items from creative and who picks them up
  # Useful for catching item duping/spawning for other players
  creative-item-drops:
    enabled: false
    # Track who picks up items dropped by creative mode players
    track-pickup: true
    # How long (in seconds) to track dropped items before forgetting them
    # Default: 300 seconds (5 minutes)
    tracking-duration: 300

  # Monitor all commands (not just ops/permission holders)
  all-commands: false

  # Command blacklist - these commands will never be logged
  # Separate lists for player and console commands
  command-blacklist:
    enabled: true

    # Player commands to never log
    player:
      - "login"
      - "register"
      - "password"
      - "2fa"

    # Console commands to never log
    # Useful for filtering out plugin automation
    console:
      - "examplecommand"

# Bypass permissions
# Players with these permissions will NOT be monitored
# Give to trusted admins who don't need watching
# adminwatchdog.bypass.commands - bypass command logging
# adminwatchdog.bypass.creative - bypass creative inventory logging
# adminwatchdog.bypass.customresponses - bypass custom response triggers
# adminwatchdog.bypass.gamemode - bypass gamemode change logging

# Logging settings
logging:
  # Enable file logging
  file-logging: true

  # Log file name format (use %date% for current date)
  log-file-format: "commands-%date%.log"

  # Maximum log file size in MB (0 = unlimited)
  max-file-size: 10

  # Number of old log files to keep
  keep-old-logs: 5

# Update checker settings
update-checker:
  # Enable automatic update checking
  enabled: true
  # Send Discord notifications for updates
  discord-notifications: true

# General settings
general:
  # Check for updates on startup
  check-updates: true

  # Debug mode (more verbose logging)
  debug: false

  # Plugin prefix for messages
  prefix: "&7[&6AdminWatchdog&7]&r "

  # Date/time format for logs
  time-format: "yyyy-MM-dd HH:mm:ss"

# Don't change this unless you know what you're doing
config-version: 3
